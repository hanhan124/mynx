<!doctype html>
<html lang="zh-CN" data-theme="pearl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mynx</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("mynx-theme");
          const theme = saved === "graphite" || saved === "pearl"
            ? saved
            : saved === "system"
              ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "graphite" : "pearl")
              : "pearl";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === "graphite" ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "pearl";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <style>
      body { margin: 0; background: #f4f4f6; }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      #root:empty::after {
        content: "";
        width: 32px;
        height: 32px;
        border: 3px solid rgba(0,0,0,0.08);
        border-top-color: #007aff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
