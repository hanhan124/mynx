[package]
name = "mynx-rnaseq"
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
mynx-contracts = { path = "../mynx-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync"] }
calamine = "0.30"
csv = "1.3"
