[workspace]
resolver = "2"
members = [
    "crates/mynx-contracts",
    "crates/mynx-core",
    "crates/mynx-jobs",
]

[package]
name = "mynx-next"
version = "3.0.4"
description = "Mynx — qPCR and RNA-seq analysis, scientific charts and image conversion"
license = "Apache-2.0"
authors = ["Mynx Team"]
edition = "2021"
default-run = "mynx-next"

[lib]
name = "mynx_next_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mynx-contracts = { path = "crates/mynx-contracts" }
mynx-core = { path = "crates/mynx-core" }
mynx-jobs = { path = "crates/mynx-jobs" }
mynx-image = { path = "crates/mynx-image" }
mynx-qpcr = { path = "crates/mynx-qpcr" }
mynx-rnaseq = { path = "crates/mynx-rnaseq" }
mynx-charts = { path = "crates/mynx-charts" }

tauri = { version = "=2.11.5", features = ["macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-http = "=2.6.0"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-os = "=2.3.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.13", features = ["json"] }
dunce = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
