[package]
name = "mynx"
version = "2.3.9"
description = "qPCR Tools & Image Converter"
license = "Apache-2.0"
authors = ["Mynx Team"]
edition = "2021"

[lib]
name = "mynx_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-os = "=2.3.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-store = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13", features = ["json"] }
# Image conversion pipeline — all heavy lifting via established open-source
# crates (image-rs, oxipng, color_quant, resvg, kamadak-exif, imageproc).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif", "ico", "tga", "pnm", "qoi", "dds", "rayon", "color_quant"] }
# default-features off drops the binary (clap) / zopfli / filetime extras.
oxipng = { version = "9", default-features = false, features = ["parallel"] }
png = "0.18"
# Must match the color_quant version image-rs itself uses, so NeuQuant
# implements image::imageops::ColorMap for the Floyd–Steinberg dither call.
color_quant = "1.1"
resvg = "0.45"
kamadak-exif = "0.6"
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"
rayon = "1.10"
base64 = "0.22"
# Multi-page TIFF decode/encode fixtures (image-rs only exposes page 1).
# Must match the tiff version image-rs uses internally.
tiff = "0.11"
