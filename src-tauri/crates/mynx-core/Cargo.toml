[package]
name = "mynx-core"
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
mynx-contracts = { path = "../mynx-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
reqwest = { version = "0.13", features = ["json"] }
