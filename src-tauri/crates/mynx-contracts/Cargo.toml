[package]
name = "mynx-contracts"
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl", "import-esm"] }
schemars = "1"
